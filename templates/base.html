<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VULNLAB{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <div class="inner">
      <div class="brand">VULN<span>LAB</span></div>
      <nav>
        <a href="{{ url_for('index') }}">home</a>
        <a href="{{ url_for('login') }}">login</a>
        <a href="{{ url_for('ping') }}">ping</a>
        <a href="{{ url_for('admin') }}">admin</a>
        {% if session.get('user') %}
          <a href="{{ url_for('dashboard') }}">dashboard</a>
          <a href="{{ url_for('logout') }}">logout ({{ session.get('user') }})</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">VULNLAB &middot; intentionally vulnerable &middot; for isolated lab use only</div>
  </footer>
</body>
</html>
